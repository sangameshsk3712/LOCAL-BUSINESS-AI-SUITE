<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Business Suite AI - Offline Mode</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #020617;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        h2 { margin: 12px 0 8px; color: #38bdf8; font-size: 20px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 40px;">⚡</div>
        <h2>Offline Cache Active</h2>
        <p>You are operating on the local device offline cache. All store receipts, POS orders, and CRM leads are queued in the local hardware vault and will sync once reconnected.</p>
        <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
